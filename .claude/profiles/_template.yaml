# =============================================================================
# Project Profile Template
# =============================================================================
# Copy this file to .claude/profiles/<your-project>.yaml and fill in the values.
# See .claude/specs/project-profile-schema.md for the full schema specification.
#
# All agents in .claude/agents/ read this profile at initialization to
# determine language-specific toolchain commands, governance policies,
# and review configuration.
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Identity — What is this project?
# -----------------------------------------------------------------------------
identity:
  project_name: ""          # e.g., "my-service", "data-pipeline"
  language: ""              # Primary language: Rust | Python | TypeScript | Go | C | C++
  runtime: ""               # native | vm | interpreted | browser
  description: ""           # One-sentence project description

# -----------------------------------------------------------------------------
# 2. Layout — Where are things?
# -----------------------------------------------------------------------------
layout:
  context_dir: ".claude/context"  # Reference material (docs, examples, submodules)
  src_paths:                # Source code directories (relative to project root)
    - "src/"
  test_paths:               # Test directories
    - "tests/"
  doc_paths:                # Documentation directories
    - "docs/"
    - "README.md"
  task_todo_dir: ".claude/features/todo"
  task_completed_dir: ".claude/features/completed"
  tracker_file: ".claude/features/ticket_tracker.md"
  artifacts_dir: ".claude/artifacts"

# -----------------------------------------------------------------------------
# 3. Toolchain — How do we build, test, lint, format?
# -----------------------------------------------------------------------------
# Replace these with your project's actual commands.
# Agents use these tokens: {{toolchain.test_cmd_full}}, {{toolchain.lint_cmd}}, etc.
toolchain:
  # Pre-flight validation (runs before any implementation)
  precheck_cmd: ""          # e.g., "cargo check", "python -m py_compile src/", "tsc --noEmit"

  # Package installation
  package_install_cmd: ""   # e.g., "cargo build", "pip install -e '.[dev]'", "npm install"

  # Testing
  test_cmd_full: ""         # e.g., "cargo test --all", "pytest tests/ -v", "npm test"
  test_cmd_targeted: ""     # e.g., "cargo test {target}", "pytest {target} -v", "npx jest {target}"
  test_output_format: ""    # cargo_json | pytest_json | go_test | jest_json | junit_xml
  test_framework: ""        # e.g., "cargo-test", "pytest", "jest", "go-test"

  # Code quality
  format_cmd: ""            # e.g., "cargo fmt --all", "ruff format .", "prettier --write ."
  lint_cmd: ""              # e.g., "cargo clippy -- -D warnings", "ruff check .", "eslint ."

# -----------------------------------------------------------------------------
# 4. Governance — What are the quality policies?
# -----------------------------------------------------------------------------
governance:
  # Test policies
  skip_policy: "fail"       # How to treat skipped tests: fail | warn | allow
  xfail_policy: "warn"     # How to treat expected failures: fail | warn | allow

  # Fix iteration limits
  max_fix_iterations: 3     # Max attempts to fix a failing test/lint issue per step

  # Auto-fix rules (used by triager agent)
  autofix_confidence_threshold: 0.7
  autofix_confidence_rules:
    # confidence >= 0.9 AND risk == "low"  → Apply automatically
    # confidence >= 0.7 AND risk == "low"  → Ask user confirmation
    # Otherwise                             → Log as suggestion only
    auto_apply_min_confidence: 0.9
    user_confirm_min_confidence: 0.7
    max_risk_for_auto: "low"

# -----------------------------------------------------------------------------
# 5. Review Graph — How do review agents run?
# -----------------------------------------------------------------------------
# Defines which review agents run, in what order, with what models.
# Default: 3 batches (correctness, then quality + docs, then extended).
review_graph:
  merge_strategy: "highest_severity"  # How to deduplicate: highest_severity | union | first_seen

  agents:
    - id: "review-correctness-defensive"
      model: ""             # Override model, or leave blank for agent default
      blocking: true
    - id: "review-correctness-specification"
      model: ""
      blocking: true
    - id: "review-quality-structural"
      model: ""
      blocking: false
    - id: "review-quality-evolutionary"
      model: ""
      blocking: false
    - id: "review-docs-consistency"
      model: ""
      blocking: false
    - id: "review-error-surface"
      model: ""
      blocking: false
    - id: "review-operations-hygiene"
      model: ""
      blocking: false
    - id: "review-test-quality"
      model: ""
      blocking: false

  batches:
    - name: "correctness"
      agents: ["review-correctness-defensive", "review-correctness-specification"]
      parallel: true
      blocking: true        # If critical/high findings, workflow blocks
    - name: "quality"
      agents: ["review-quality-structural", "review-quality-evolutionary", "review-docs-consistency"]
      parallel: true
      blocking: false       # Advisory only
    - name: "extended"
      agents: ["review-error-surface", "review-operations-hygiene", "review-test-quality"]
      parallel: true
      blocking: false       # Advisory — error handling, ops hygiene, test quality

# -----------------------------------------------------------------------------
# 6. Lifecycle — Task management
# -----------------------------------------------------------------------------
lifecycle:
  ticket_states: ["todo", "refined", "in_progress", "blocked", "done"]
  required_fields: ["title", "description", "acceptance_criteria"]
  definition_of_done:
    - "All acceptance criteria met with evidence"
    - "All tests pass (per governance policy)"
    - "Code formatted and linted"
    - "Review findings resolved or acknowledged"
    - "Example objects exist for all new components (when extensions.moldable.enabled)"
    - "FFI boundary conformance tests pass (when extensions.component_model.enabled)"
    - "Hot-reload smoke examples pass after state migration (when extensions.hot_reload.enabled)"

# -----------------------------------------------------------------------------
# 7. Execution — Agent orchestration mode
# -----------------------------------------------------------------------------
execution:
  mode: "monolithic"        # monolithic (single agent) | supervisor (multi-agent delegation)
  delegation_strategy: "phase_level"  # phase_level | step_level (only for supervisor mode)

